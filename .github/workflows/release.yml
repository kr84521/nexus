# Publica una Release de GitHub con el instalador firmado y latest.json (lo que lee el actualizador).
# Se dispara al subir una etiqueta vX.Y.Z:
#   1. Sube "version" en src-tauri/tauri.conf.json, src-tauri/Cargo.toml y package.json
#   2. git commit, git tag v0.3.0, git push --tags
# Requiere el secret TAURI_SIGNING_PRIVATE_KEY (contenido de ~/.tauri/nexus.key).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Nexus ${{ github.ref_name }}"
          releaseBody: "Instalador para Windows. Las instalaciones existentes se actualizan solas desde Ajustes → Actualizaciones."
          releaseDraft: false
          prerelease: false
