# Publica una Release de GitHub con el instalador firmado y latest.json (lo que lee el actualizador).
# Se dispara al subir una etiqueta vX.Y.Z:
#   1. Sube "version" en src-tauri/tauri.conf.json, src-tauri/Cargo.toml y package.json
#   2. git commit, git tag v0.3.0, git push --tags
# Requiere el secret TAURI_SIGNING_PRIVATE_KEY (contenido de ~/.tauri/nexus.key).
# Las notas de la versión salen de release-notes/vX.Y.Z.md: van al cuerpo de la Release y a latest.json,
# y Nexus las muestra en Ajustes → Actualizaciones antes de instalar.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Notas de la versión
        id: notes
        shell: bash
        run: |
          f="release-notes/${GITHUB_REF_NAME}.md"
          {
            echo "body<<NOTES_EOF"
            if [ -f "$f" ]; then cat "$f"; else echo "Instalador para Windows. Las instalaciones existentes se actualizan desde Ajustes → Actualizaciones."; fi
            echo
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Nexus ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
